name: Mouse Profile Hub

on:
  pull_request:
    paths:
      - "tools/mouse_profile_hub/**"
      - "tools/mouse_lab/config.py"
      - "tests/test_mouse_profile_hub.py"
      - "Start Input Profile Hub.bat"
      - ".github/workflows/mouse-profile-hub.yml"
  push:
    branches: [main]
    paths:
      - "tools/mouse_profile_hub/**"
      - "tools/mouse_lab/config.py"
      - "tests/test_mouse_profile_hub.py"

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile hub modules
        run: python -m compileall -q tools/mouse_profile_hub tools/mouse_lab/config.py
      - name: Run hub tests
        run: python -m pytest tests/test_mouse_profile_hub.py -q
      - name: Verify Tkinter
        run: python -c "import tkinter; print(tkinter.TkVersion)"
